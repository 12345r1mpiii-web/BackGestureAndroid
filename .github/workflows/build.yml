name: Back Gesture Android — RootHide arm64e

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.2"

      - name: Install build dependencies
        run: brew install ldid make

      - name: Install RootHide Theos and iOS SDK
        run: |
          git clone --recursive https://github.com/roothide/theos.git "$GITHUB_WORKSPACE/theos"
          export THEOS="$GITHUB_WORKSPACE/theos"
          "$THEOS/bin/install-sdk" iPhoneOS16.5
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          echo "$THEOS/bin" >> "$GITHUB_PATH"

      - name: Build RootHide package
        run: |
          export THEOS="$GITHUB_WORKSPACE/theos"
          make clean package THEOS_PACKAGE_SCHEME=roothide FINALPACKAGE=1
          test -n "$(find packages -maxdepth 1 -name '*.deb' -print -quit)"
          dpkg-deb -f packages/*.deb Package Version Architecture Depends

      - name: Upload installable Debian package
        uses: actions/upload-artifact@v4
        with:
          name: BackGestureAndroid-RootHide-arm64e
          path: packages/*.deb
          if-no-files-found: error
