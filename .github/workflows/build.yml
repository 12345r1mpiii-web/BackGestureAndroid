name: Build Back Gesture Android (RootHide arm64e)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  roothide:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          brew install make ldid
      - name: Install RootHide Theos
        run: |
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/roothide/theos/master/bin/install-theos)"
          echo "$HOME/theos/bin" >> "$GITHUB_PATH"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
      - name: Build RootHide arm64e package
        run: |
          export THEOS="$HOME/theos"
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide
          ls -lah packages/
          dpkg-deb -f packages/*.deb Package Version Architecture Depends
      - name: Upload RootHide deb
        uses: actions/upload-artifact@v4
        with:
          name: BackGestureAndroid-RootHide-arm64e
          path: packages/*.deb
          if-no-files-found: error
